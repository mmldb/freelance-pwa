<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freelance OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans">
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-6">
        <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-black italic tracking-tighter text-slate-800 mb-2 font-sans">FREEOS.</h1>
            <input type="password" id="pass" class="w-full p-4 rounded-2xl border-2 border-slate-100 text-center text-xl outline-none focus:border-indigo-500 mb-4 font-sans" placeholder="••••">
            <button onclick="check()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold uppercase tracking-widest shadow-lg">Belépés</button>
            <p id="err" class="text-red-500 text-xs mt-4 hidden font-bold">HIBÁS KÓD</p>
        </div>
    </div>

    <div id="main-screen" class="hidden bg-slate-50 min-h-screen w-full p-4 overflow-y-auto font-sans">
        <div class="max-w-md mx-auto py-6">
            <div class="flex justify-between items-center mb-8 px-2 text-slate-900">
                <h2 class="text-2xl font-black italic tracking-tighter text-indigo-900">FREEOS.</h2>
                <button onclick="logout()" class="text-[10px] font-bold text-slate-300 uppercase">Kilépés</button>
            </div>
            
            <div class="space-y-4 mb-8">
                <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Összes Bruttó</p>
                    <p class="text-3xl font-black text-slate-900">10 176 939 Ft</p>
                </div>
                <div class="bg-indigo-600 p-6 rounded-[32px] shadow-xl text-white">
                    <p class="text-indigo-200 text-[10px] font-bold uppercase mb-1">Bankban (EKHO Nettó)</p>
                    <p class="text-3xl font-black tracking-tight">8 140 398 Ft</p>
                    <p class="text-[9px] text-indigo-300 mt-2 font-medium italic">Adók és fixek levonva</p>
                </div>
            </div>

            <div id="list" class="space-y-3 mb-8"></div>
        </div>
    </div>

    <script>
        const P = "2026FreeLanceD";
        const inv = [
            {id: 'E-2026-1', a: 3304125}, {id: 'E-2026-2', a: 4322200},
            {id: 'E-2026-5', a: 1706628}, {id: 'E-2026-6', a: 843986}
        ];

        function check() {
            if(document.getElementById('pass').value === P) {
                localStorage.setItem('auth', '1');
                render();
            } else { document.getElementById('err').classList.remove('hidden'); }
        }

        function logout() { localStorage.clear(); location.reload(); }

        function toggle(id) {
            const v = localStorage.getItem('p_'+id) === '1' ? '0' : '1';
            localStorage.setItem('p_'+id, v);
            render();
        }

        function render() {
            if(localStorage.getItem('auth') !== '1') return;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.body.className = "bg-slate-50";

            const container = document.getElementById('list');
            container.innerHTML = '<h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-3">Számlák</h3>';
            
            inv.forEach(i => {
                const isP = localStorage.getItem('p_'+i.id) === '1';
                const d = document.createElement('div');
                d.className = `p-4 rounded-[24px] border flex justify-between items-center bg-white ${isP ? 'border-green-100 shadow-sm' : 'border-slate-50 opacity-60'}`;
                d.innerHTML = `<div><p class="text-[9px] font-bold text-slate-400 font-sans">${i.id}</p><p class="font-bold text-slate-800 font-sans">${i.a.toLocaleString()} Ft</p></div><button onclick="toggle('${i.id}')" class="w-10 h-10 rounded-2xl flex items-center justify-center ${isP ? 'bg-green-500 text-white' : 'bg-slate-50 text-slate-200'}">${isP ? '✓' : ''}</button>`;
                container.appendChild(d);
            });
        }
        render();
    </script>
</body>
</html>
