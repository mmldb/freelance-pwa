<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance HQ 2026</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        h1, h2 { margin: 0 0 10px 0; font-size: 1rem; color: var(--blue); }
        .big { font-size: 1.4rem; font-weight: bold; }
        
        /* Grafikon */
        .chart { height: 150px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 2px solid #475569; position: relative; padding-top: 30px; }
        .bar { background: var(--blue); flex: 1; position: relative; border-radius: 4px 4px 0 0; min-height: 2px; }
        .bar.goal { background: var(--green); }
        .line { position: absolute; width: 100%; border-top: 2px dashed var(--red); opacity: 0.6; z-index: 5; }
        .label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; }

        /* Lista */
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
        .box { width: 30px; height: 30px; border: 2px solid var(--blue); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .done { background: var(--green); border-color: var(--green); }
        
        #login { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        input { padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; text-align: center; width: 200px; }
        button { padding: 12px 30px; border-radius: 8px; background: var(--blue); border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="login">
    <h1>BELÉPÉS</h1>
    <input type="password" id="pw" placeholder="Kód...">
    <button onclick="check()">INDÍTÁS</button>
</div>

<div id="main" class="hidden">
    <div style="display: flex; gap: 10px;">
        <div class="card" style="flex: 1;">
            <h2>Bruttó</h2>
            <div id="total-g" class="big">0 Ft</div>
        </div>
        <div class="card" style="flex: 1;">
            <h2>EKHO Nettó</h2>
            <div id="total-n" class="big" style="color: var(--green);">0 Ft</div>
        </div>
    </div>

    <div class="card">
        <h2>A HAJSZA (2M/hó)</h2>
        <div class="chart" id="chart"></div>
    </div>

    <div class="card">
        <h2>SZÁMLÁK</h2>
        <div id="list"></div>
    </div>
</div>

<script>
    const KEY = "2026freelanced";
    const TARGET = 2000000;

    // Adatok az elküldött számláid alapján
    const data = [
        { id: "E-2026-1", p: "Future Deluxe", v: 3304125, m: 0, paid: true },
        { id: "E-2026-2", p: "Future Deluxe", v: 4322200, m: 2, paid: false },
        { id: "E-2026-5", p: "OZ Club", v: 1706628, m: 2, paid: false },
        { id: "E-2026-6", p: "OZ Club", v: 843986, m: 3, paid: false }
    ];

    function check() {
        const val = document.getElementById('pw').value.toLowerCase();
        if(val === KEY) {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');
            draw();
        } else {
            alert("Hibás kód!");
        }
    }

    // Enter gomb figyelése
    document.getElementById('pw').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') check();
    });

    function draw() {
        const list = document.getElementById('list');
        const chart = document.getElementById('chart');
        let gross = 0, net = 0, monthly = [0, 0, 0, 0];

        list.innerHTML = '';
        data.forEach((inv, i) => {
            gross += inv.v;
            monthly[inv.m] += inv.v;
            if(inv.paid) net += (inv.v - 50000) * 0.85;

            list.innerHTML += `
                <div class="item">
                    <div><strong>${inv.id}</strong><br><small>${inv.v.toLocaleString()} Ft</small></div>
                    <div class="box ${inv.paid ? 'done' : ''}" onclick="toggle(${i})">${inv.paid ? '✓' : ''}</div>
                </div>`;
        });

        document.getElementById('total-g').innerText = gross.toLocaleString() + ' Ft';
        document.getElementById('total-n').innerText = Math.round(net).toLocaleString() + ' Ft';

        const months = ['Jan', 'Feb', 'Már', 'Ápr'];
        const max = 6000000; 
        chart.innerHTML = `<div class="line" style="bottom: ${(TARGET/max)*150}px"></div>`;
        
        monthly.forEach((val, i) => {
            const h = (val / max) * 150;
            const isOver = val >= TARGET;
            chart.innerHTML += `<div class="bar ${isOver?'goal':''}" style="height:${Math.max(h, 5)}px"><span class="label">${months[i]}</span></div>`;
        });
    }

    function toggle(i) {
        data[i].paid = !data[i].paid;
        draw();
    }
</script>
</body>
</html>
