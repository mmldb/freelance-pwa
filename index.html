<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freelance OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans transition-colors duration-500">
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-6">
        <div class="w-full max-w-sm space-y-6">
            <input type="password" id="pass" class="w-full p-5 rounded-3xl bg-slate-800 border border-slate-700 text-white text-center text-2xl outline-none focus:border-indigo-500 transition-all shadow-2xl" placeholder="••••">
            <button onclick="check()" class="w-full py-5 bg-indigo-600 text-white rounded-3xl font-bold uppercase tracking-[0.2em] shadow-lg active:scale-95 transition-all">Belépés</button>
            <p id="err" class="text-red-500 text-xs text-center hidden font-bold">Hibás kód!</p>
        </div>
    </div>

    <div id="main-screen" class="hidden bg-slate-50 min-h-screen w-full p-4 pb-12 overflow-y-auto">
        <div class="max-w-md mx-auto py-4 text-slate-900">
            
            <div class="flex justify-between items-center mb-8 px-2">
                <h2 class="text-2xl font-black italic tracking-tighter text-indigo-900">FREEOS.</h2>
                <button onclick="logout()" class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">Kilépés</button>
            </div>
            
            <div class="space-y-4 mb-8">
                <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Kiállított számlák (Összes)</p>
                    <p id="total-gross-display" class="text-3xl font-black text-slate-900">0 Ft</p>
                </div>
                <div class="bg-indigo-600 p-6 rounded-[32px] shadow-xl shadow-indigo-100 text-white relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-indigo-200 text-[10px] font-bold uppercase mb-1">Bankban / Kivehető (EKHO)</p>
                        <p id="total-net-display" class="text-3xl font-black tracking-tight">0 Ft</p>
                        <p class="text-[9px] text-indigo-300 mt-2 font-medium italic italic underline opacity-80">Csak a fizetett számlákból, adók levonva</p>
                    </div>
                </div>
            </div>

            <div class="mb-8">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-[0.1em] mb-4 px-2">Számlák kezelése</h3>
                <div id="invoice-list" class="space-y-3">
                    </div>
            </div>

            <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-6 text-center tracking-widest">Trend vs Cél</p>
                <div id="bar-chart" class="flex items-end justify-between h-24 gap-3 px-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const PASS = "2026FreeLanceD";
        const FIXED_TAX = 150000;
        const MONTHLY_TARGET = 2000000;

        // ADATOK (Itt tudod bővíteni az új számlákkal)
        const invoices = [
            { id: 'E-2026-1', date: '2026-01-29', amount: 3304125, label: 'Jan' },
            { id: 'E-2026-2', date: '2026-03-02', amount: 4322200, label: 'Már' },
            { id: 'E-2026-5', date: '2026-03-26', amount: 1706628, label: 'Már' },
            { id: 'E-2026-6', date: '2026-04-02', amount: 843986, label: 'Ápr' }
        ];

        function check() {
            if(document.getElementById('pass').value === PASS) {
                localStorage.setItem('freeos_auth', 'true');
                render();
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('freeos_auth');
            location.reload();
        }

        function togglePaid(id) {
            const currentStatus = localStorage.getItem('paid_' + id) === 'true';
            localStorage.setItem('paid_' + id, !currentStatus);
            render();
        }

        function render() {
            const isAuth = localStorage.getItem('freeos_auth') === 'true';
            if(!isAuth) return;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.body.className = "bg-slate-50 min-h-screen font-sans";

            let totalGross = 0;
            let totalPaidGross = 0;
            const listContainer = document.getElementById('invoice-list');
            const chartContainer = document.getElementById('bar-chart');
            
            listContainer.innerHTML = '';
            chartContainer.innerHTML = '';

            invoices.forEach((inv, index) => {
                totalGross += inv.amount;
                const isPaid = localStorage.getItem('paid_' + inv.id) === 'true';
                if(isPaid) totalPaidGross += inv.amount;

                // Lista elem generálás
                const div = document.createElement('div');
                div.className = `p-4 rounded-2xl border transition-all flex justify-between items-center ${isPaid ? 'bg-white border-green-100' : 'bg-white border-slate-100 opacity-60'}`;
                div.innerHTML = `
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">${inv.id} • ${inv.date}</p>
                        <p class="font-bold text-slate-800">${inv.amount.toLocaleString()} Ft</p>
                    </div>
                    <button onclick="togglePaid('${inv.id}')" class="w-10 h-10 rounded-full flex items-center justify-center border-2 ${isPaid ? 'bg-green-500 border-green-500 text-white' : 'border-slate-100 text-slate-200'}">
                        ${isPaid ? '✓' : ''}
                    </button>
                `;
                listContainer.appendChild(div);
            });

            // Adó számítás (4 hónapra)
            const monthsElapsed = 4;
            const taxableBase = totalPaidGross - (FIXED_TAX * monthsElapsed);
            const netTakeHome = taxableBase > 0 ? taxableBase * 0.85 : 0;

            document.getElementById('total-gross-display').innerText = totalGross.toLocaleString() + ' Ft';
            document.getElementById('total-net-display').innerText = Math.floor(netTakeHome).toLocaleString() + ' Ft';

            // Chart generálás (Egyszerűsített)
            const labels = ['Jan', 'Feb', 'Már', 'Ápr'];
            const monthlyValues = [3304125, 0, 6028828, 843986];
            let cum = 0;
            labels.forEach((label, i) => {
                cum += monthlyValues[i];
                const h = (cum / 10000000) * 100;
                chartContainer.innerHTML += `
                    <div class="w-full bg-slate-100 rounded-t-lg relative">
                        <div class="bg-indigo-500 rounded-t-lg absolute bottom-0 w-full transition-all duration-700" style="height: ${h}%"></div>
                        <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[9px] font-bold text-slate-300 uppercase">${label}</span>
                    </div>
                `;
            });
        }

        render();
        document.getElementById('pass').addEventListener('keypress', e => { if(e.key === 'Enter') check(); });
    </script>
</body>
</html>
