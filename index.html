<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freelance OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        input:focus { border-color: #4f46e5 !important; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen font-sans">

    <div id="login-screen" class="flex items-center justify-center min-h-screen p-6">
        <div class="w-full max-w-sm text-center">
            <h1 class="text-4xl font-black italic tracking-tighter text-white mb-8">FREEOS.</h1>
            <input type="password" id="pass" class="w-full p-5 rounded-3xl bg-slate-800 border border-slate-700 text-white text-center text-2xl outline-none mb-4" placeholder="••••">
            <button onclick="check()" class="w-full py-5 bg-white text-slate-900 rounded-3xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all">Belépés</button>
            <p id="err" class="text-red-400 text-xs mt-4 hidden font-bold">HIBÁS KÓD</p>
        </div>
    </div>

    <div id="main-screen" class="hidden bg-slate-50 min-h-screen w-full p-4 pb-12 overflow-y-auto">
        <div class="max-w-md mx-auto py-4">
            <header class="flex justify-between items-center mb-8 px-2">
                <h2 class="text-2xl font-black italic tracking-tighter text-indigo-900 leading-none">FREEOS.</h2>
                <button onclick="logout()" class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">Kilépés</button>
            </header>
            
            <div class="space-y-4 mb-8">
                <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Kiállított (Összes)</p>
                    <p id="total-gross" class="text-3xl font-black text-slate-900">0 Ft</p>
                </div>
                <div class="bg-indigo-600 p-6 rounded-[32px] shadow-xl text-white">
                    <p class="text-indigo-200 text-[10px] font-bold uppercase mb-1 font-medium">Bankban (EKHO Nettó)</p>
                    <p id="total-net" class="text-3xl font-black">0 Ft</p>
                    <p class="text-[9px] text-indigo-300 mt-2 font-medium italic">Adók és fixek levonva</p>
                </div>
            </div>

            <div class="mb-8">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-3">Számlák</h3>
                <div id="invoice-list" class="space-y-3"></div>
            </div>

            <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-6 text-center tracking-widest">Trend (Március ugrás)</p>
                <div id="bar-chart" class="flex items-end justify-between h-24 gap-3 px-2"></div>
                <div class="flex justify-between mt-4 text-[10px] font-bold text-slate-300 uppercase px-1">
                    <span>Jan</span><span>Feb</span><span>Már</span><span>Ápr</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PASS = "2026FreeLanceD";
        const FIXED_TAX = 150000;
        const invoices = [
            { id: 'E-2026-1', amount: 3304125, label: 'Jan' },
            { id: 'E-2026-2', amount: 4322200, label: 'Már' },
            { id: 'E-2026-5', amount: 1706628, label: 'Már' },
            { id: 'E-2026-6', amount: 843986, label: 'Ápr' }
        ];

        function check() {
            if(document.getElementById('pass').value === PASS) {
                localStorage.setItem('f_auth', '1');
                render();
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function toggle(id) {
            const val = localStorage.getItem('p_' + id) === '1' ? '0' : '1';
            localStorage.setItem('p_' + id, val);
            render();
        }

        function render() {
            if(localStorage.getItem('f_auth') !== '1') return;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.body.className = "bg-slate-50";

            let g = 0; let p = 0;
            const list = document.getElementById('invoice-list');
            list.innerHTML = '';
            
            invoices.forEach(i => {
                g += i.amount;
                const isP = localStorage.getItem('p_' + i.id) === '1';
                if(isP) p += i.amount;

                const div = document.createElement('div');
                div.className = `p-4 rounded-3xl border flex justify-between items-center bg-white ${isP ? 'border-green-100 shadow-sm' : 'border-slate-100 opacity-60'}`;
                div.innerHTML = `<div><p class="text-[9px] font-bold text-slate-400">${i.id}</p><p class="font-bold text-slate-800">${i.amount.toLocaleString()} Ft</p></div><button onclick="toggle('${i.id}')" class="w-10 h-10 rounded-2xl border-2 flex items-center justify-center ${isP ? 'bg-green-500 border-green-500 text-white' : 'border-slate-100 text-slate-200'}">${isP ? '✓' : ''}</button>`;
                list.appendChild(div);
            });

            const net = (p - (FIXED_TAX * 4)) * 0.85;
            document.getElementById('total-gross').innerText = g.toLocaleString() + ' Ft';
            document.getElementById('total-net').innerText = Math.max(0, Math.floor(net)).toLocaleString() + ' Ft';

            const chart = document.getElementById('bar-chart');
            chart.innerHTML = '';
            const vals = [3304125, 0, 6028828, 843986];
            let c = 0;
            vals.forEach(v => {
                c += v;
                const h = (c / 12000000) * 100;
                chart.innerHTML += `<div class="w-full bg-slate-100 rounded-t-lg relative h-full"><div class="bg-indigo-500 rounded-t-lg absolute bottom-0 w-full" style="height:${h}%"></div></div>`;
            });
        }
        render();
    </script>
</body>
</html>
